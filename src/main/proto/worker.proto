syntax = "proto3";

package distrilab;

import "bootstrap.proto";
import "job.proto";

option java_multiple_files = true;
option java_package = "com.distrilab.grpc";
option java_outer_classname = "WorkerProto";

// Worker <-> worker communication. Replaces the RMI WorkerInterface.
service WorkerService {
  // Liveness and status, used to detect failed neighbours and a failed coordinator.
  rpc Ping (PingRequest) returns (PingResponse);
  rpc GetStatus (Empty) returns (WorkerStatus);

  // Unstructured overlay network.
  rpc AddNeighbour (WorkerInfo) returns (Ack);
  rpc SendMessage (TextMessage) returns (Ack);

  // Leader election.
  rpc ReceiveElection (ElectionMessage) returns (Ack);
  rpc ReceiveElectionData (ElectionData) returns (Ack);
  rpc FinishElection (ElectionMessage) returns (Ack);
  rpc ReceiveCoordinator (CoordinatorAnnouncement) returns (Ack);

  // Runs one partition of a job. The worker streams progress as it works
  // and finishes with an update where done = true.
  rpc ExecuteTask (TaskRequest) returns (stream TaskUpdate);

  // Coordinator state replication, so a replacement coordinator can resume jobs.
  rpc ReplicateJobState (JobCheckpoint) returns (Ack);
  rpc GetReplicatedJobs (Empty) returns (JobCheckpointList);
}

message PingRequest {
  int32 sender_id = 1;
  int64 coordinator_term = 2;
}

message PingResponse {
  int32 worker_id = 1;
  int32 coordinator_id = 2;  // -1 when no coordinator is known
  int64 coordinator_term = 3;
}

message WorkerStatus {
  int32 worker_id = 1;
  int32 jac = 2;
  int32 coordinator_id = 3;  // -1 when no coordinator is known
  int64 coordinator_term = 4;
  int32 running_tasks = 5;
}

message TextMessage {
  int32 sender_id = 1;
  string text = 2;
}

message ElectionMessage {
  string election_id = 1;
  int32 sender_id = 2;
}

message ElectionData {
  string election_id = 1;
  int32 candidate_id = 2;
  int32 candidate_jac = 3;
}

message CoordinatorAnnouncement {
  int32 coordinator_id = 1;
  int64 term = 2;
  string election_id = 3;
}
