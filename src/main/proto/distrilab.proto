syntax = "proto3";

package distrilab;

option java_multiple_files = true;
option java_package = "com.distrilab.grpc";

// 1. BOOTSTRAP SERVICE
service BootstrapService {
  rpc RegisterWorker (WorkerMetadata) returns (RegisterResponse);
  rpc GetActiveWorkers (Empty) returns (WorkerList);
  rpc UnregisterWorker (WorkerMetadata) returns (UnregisterResponse);
}

// MESSAGES
message Empty {}

message WorkerMetadata {
  string worker_id = 1;
  string ip_address = 2;
  int32 port = 3;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  repeated WorkerMetadata active_workers = 3;
}

message UnregisterResponse {
  bool success = 1;
}

message WorkerList {
  repeated WorkerMetadata workers = 1;
}