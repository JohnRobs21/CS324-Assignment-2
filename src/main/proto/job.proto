syntax = "proto3";

package distrilab;

option java_multiple_files = true;
option java_package = "com.distrilab.grpc";
option java_outer_classname = "JobProto";

// Client -> coordinator job submission. Replaces the RMI methods
// submitMaxJob, submitPrimeSumJob and submitPrimeCountJob.
service JobService {
  // Submits a job and streams progress until it completes or fails.
  rpc SubmitJob (JobRequest) returns (stream JobProgress);

  // Re-attaches to a job that is already running, e.g. after the client
  // reconnects to a new coordinator.
  rpc WatchJob (JobId) returns (stream JobProgress);

  rpc GetJobStatus (JobId) returns (JobProgress);
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  MAX = 1;
  PRIME_SUM = 2;
  PRIME_COUNT = 3;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_COMPLETED = 3;
  JOB_STATE_FAILED = 4;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_DONE = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_REASSIGNED = 5;  // the worker failed and the task was given to another worker
}

message JobId {
  string job_id = 1;
}

message NumberList {
  repeated int32 numbers = 1;
}

message Range {
  int32 start = 1;  // inclusive
  int32 end = 2;    // inclusive
}

message JobRequest {
  // Generated by the client (e.g. a UUID). Resubmitting the same id after a
  // coordinator failure must not run the job twice.
  string job_id = 1;
  string client_id = 2;
  JobType type = 3;
  oneof input {
    NumberList numbers = 4;  // MAX, PRIME_COUNT
    Range range = 5;         // PRIME_SUM
  }
}

// Progress of the whole job. Units are numbers checked (MAX, PRIME_COUNT)
// or values in the range (PRIME_SUM), counted from completed distributed work.
message JobProgress {
  string job_id = 1;
  JobType type = 2;
  JobState state = 3;
  int64 completed_units = 4;
  int64 total_units = 5;
  double percent = 6;
  repeated WorkerProgress workers = 7;  // worker-level breakdown for the GUI
  int64 result = 8;                     // valid when state is COMPLETED (int64: prime sums overflow int32)
  string error = 9;
  int32 coordinator_id = 10;
}

message WorkerProgress {
  int32 worker_id = 1;
  int64 completed_units = 2;
  int64 total_units = 3;
  double percent = 4;
  TaskState state = 5;
  repeated string task_ids = 6;
}

// One partition of a job, sent by the coordinator to a worker.
message TaskRequest {
  string job_id = 1;
  string task_id = 2;  // unique, so a retried or reassigned task is not counted twice
  JobType type = 3;
  oneof input {
    NumberList numbers = 4;
    Range range = 5;
  }
  int32 coordinator_id = 6;
  int64 coordinator_term = 7;  // workers reject tasks from a coordinator with an older term
}

// Streamed by the worker while it runs a task; the last update has done = true.
message TaskUpdate {
  string task_id = 1;
  int32 worker_id = 2;
  int64 completed_units = 3;
  int64 total_units = 4;
  bool done = 5;
  int64 partial_result = 6;  // valid when done
}

// Coordinator state replicated to other workers so a new coordinator can
// resume unfinished jobs.
message TaskRecord {
  TaskRequest request = 1;
  int32 assigned_worker_id = 2;
  TaskState state = 3;
  int64 completed_units = 4;
  int64 partial_result = 5;
}

message JobCheckpoint {
  JobRequest request = 1;
  JobState state = 2;
  repeated TaskRecord tasks = 3;
  int64 coordinator_term = 4;
  int64 updated_at_ms = 5;
}

message JobCheckpointList {
  repeated JobCheckpoint jobs = 1;
}
